name: Registry package, IDF consumer and component upload
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, pack and build an isolated consumer
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Use public IDF development images until a stable 6.2 image exists.
          # Pin this to the verified release image when 6.2 is released.
          esp_idf_version: master
          target: esp32s3
          path: '.'
          command: |
            python -m pip install Pillow numpy PyYAML
            python tools/prepare_release.py --output /tmp/raylib-release
            compote component pack --project-dir /tmp/raylib-release/component --name raylib-lite-engine --dest-dir /tmp/raylib-release/archives
            python tools/check_release.py --stage /tmp/raylib-release > /tmp/raylib-release/package-check.json
            cat /tmp/raylib-release/package-check.json
            python tools/prepare_release_consumer.py --archive /tmp/raylib-release/archives/raylib-lite-engine_$(cat VERSION).tgz --example minimal --output /tmp/raylib-consumer
            idf.py -C /tmp/raylib-consumer -B /tmp/raylib-consumer-build -DIDF_TARGET=esp32s3 build
            mkdir -p dist
            cp /tmp/raylib-release/archives/*.tgz dist/
            cp /tmp/raylib-release/release-manifest.json dist/
            cp /tmp/raylib-release/package-check.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: registry-release-candidate
          path: dist/

  upload_components:
    name: Upload assembled component to Espressif Component Service
    needs: package-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: registry-release-candidate
          path: release-artifacts
      - name: Verify and unpack the checked release archive
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import yaml

          artifacts = Path("release-artifacts")
          checks = json.loads((artifacts / "package-check.json").read_text())
          if len(checks["archives"]) != 1:
              raise SystemExit("Expected exactly one checked component archive")
          expected = checks["archives"][0]
          archive = artifacts / expected["file"]
          if archive.name != expected["file"]:
              raise SystemExit("Invalid archive filename")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected["sha256"]:
              raise SystemExit("Release archive checksum mismatch")
          component = Path("publish/raylib-lite-engine")
          component.mkdir(parents=True)
          with tarfile.open(archive) as stream:
              stream.extractall(component, filter="data")
          # The uploader otherwise records this generated folder as the source
          # repository path. Source lives at the actual repository root.
          manifest = component / "idf_component.yml"
          data = yaml.safe_load(manifest.read_text())
          data["repository_info"] = {"path": ".", "commit_sha": os.environ["RELEASE_SOURCE_SHA"]}
          manifest.write_text(yaml.safe_dump(data, sort_keys=False))
          PY
      - name: Upload components to component service
        uses: espressif/upload-components-ci-action@v1
        with:
          directories: publish/raylib-lite-engine
          name: raylib-lite-engine
          namespace: espressif2022
          api_token: ${{ secrets.COMPONENTS_TOKEN }}
          # Preserve explicit root-source metadata in the assembled manifest.
          repository_url: ''
          commit_sha: ''
