name: Registry package, IDF consumer and component upload
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and pack an isolated component
        uses: espressif/esp-idf-ci-action@v1
        with:
          # ESP-IDF 6.2 has no release image tag yet. Device evidence is recorded
          # separately in docs/releasing.md; this job uses the current latest image.
          esp_idf_version: latest
          target: esp32s3
          path: '.'
          command: |
            set -euo pipefail
            python -m pip install Pillow numpy PyYAML
            python tools/prepare_release.py --output /tmp/raylib-release
            compote component pack --project-dir /tmp/raylib-release/component --name raylib-lite-engine --dest-dir /tmp/raylib-release/archives
            python tools/check_release.py --stage /tmp/raylib-release > /tmp/raylib-release/package-check.json
            cat /tmp/raylib-release/package-check.json
            mkdir -p dist
            cp /tmp/raylib-release/archives/*.tgz dist/
            cp /tmp/raylib-release/release-manifest.json dist/
            cp /tmp/raylib-release/package-check.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: registry-release-candidate
          path: dist/

  consumer-build:
    name: Build ${{ matrix.build.example }} (${{ matrix.build.board }}, IDF ${{ matrix.idf_version }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf_version: [latest, v6.1]
        build:
          - example: minimal
            chip: esp32s3
            board: none
          - example: sky_hop
            chip: esp32s31
            board: esp-mosaico
          - example: tower_defense
            chip: esp32s31
            board: esp-mosaico
          - example: raylib_shooter
            chip: esp32s31
            board: esp-mosaico
          - example: living_worlds
            chip: esp32s31
            board: esp-mosaico
          - example: last_zone_extraction
            chip: esp32s31
            board: esp-mosaico
          - example: tomb_raycast
            chip: esp32s31
            board: esp-mosaico
          - example: neon_rift_rally
            chip: esp32s31
            board: esp-mosaico
          - example: raylib_shooter
            chip: esp32s3
            board: esp32-s3-box-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: registry-release-candidate
          path: release-artifacts
      - name: Build the assembled example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf_version }}
          # The image target stays esp32s3. ESP32-S31 builds select the preview
          # toolchain inside the command; this image has no separate S31 tag.
          target: esp32s3
          path: '.'
          command: |
            set -euo pipefail
            EXAMPLE='${{ matrix.build.example }}'
            BOARD='${{ matrix.build.board }}'
            CHIP='${{ matrix.build.chip }}'
            python -m pip install Pillow numpy PyYAML
            if [ "$BOARD" != none ]; then
              python -m pip install esp-bmgr-assist
            fi
            ARCHIVE="release-artifacts/raylib-lite-engine_$(cat VERSION).tgz"
            test -f "$ARCHIVE"
            python tools/prepare_release_consumer.py --archive "$ARCHIVE" --example "$EXAMPLE" --output /tmp/raylib-consumer
            cd /tmp/raylib-consumer
            if [ "$BOARD" = esp-mosaico ]; then
              IDF_TARGET="$CHIP" idf.py --preview bmgr -c ./shared/boards/esp-mosaico/bmgr -b esp_mosaico
              IDF_TARGET="$CHIP" idf.py --preview -B /tmp/raylib-consumer-build -DIDF_TARGET="$CHIP" build
            elif [ "$BOARD" = esp32-s3-box-3 ]; then
              IDF_TARGET="$CHIP" idf.py bmgr -c ./shared/boards -b esp32_s3_box_3 -a "$PWD/shared/boards/esp32-s3-box-3/bmgr_amend"
              IDF_TARGET="$CHIP" idf.py -B /tmp/raylib-consumer-build -DIDF_TARGET="$CHIP" build
            else
              idf.py -B /tmp/raylib-consumer-build -DIDF_TARGET="$CHIP" build
            fi

  upload_components:
    name: Upload assembled component to Espressif Component Service
    needs: [package, consumer-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: registry-release-candidate
          path: release-artifacts
      - name: Verify and unpack the checked release archive
        env:
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import yaml

          artifacts = Path("release-artifacts")
          checks = json.loads((artifacts / "package-check.json").read_text())
          if len(checks["archives"]) != 1:
              raise SystemExit("Expected exactly one checked component archive")
          expected = checks["archives"][0]
          archive = artifacts / expected["file"]
          if archive.name != expected["file"]:
              raise SystemExit("Invalid archive filename")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected["sha256"]:
              raise SystemExit("Release archive checksum mismatch")
          component = Path("publish/raylib-lite-engine")
          component.mkdir(parents=True)
          with tarfile.open(archive) as stream:
              stream.extractall(component, filter="data")
          # The uploader otherwise records this generated folder as the source
          # repository path. Source lives at the actual repository root.
          manifest = component / "idf_component.yml"
          data = yaml.safe_load(manifest.read_text())
          data["repository_info"] = {"path": ".", "commit_sha": os.environ["RELEASE_SOURCE_SHA"]}
          manifest.write_text(yaml.safe_dump(data, sort_keys=False))
          PY
      - name: Upload components to component service
        uses: espressif/upload-components-ci-action@v1
        with:
          directories: publish/raylib-lite-engine
          name: raylib-lite-engine
          namespace: espressif2022
          api_token: ${{ secrets.COMPONENTS_TOKEN }}
          # Preserve explicit root-source metadata in the assembled manifest.
          repository_url: ''
          commit_sha: ''
